---
# Write a logind drop-in instead of editing /etc/systemd/logind.conf, which
# does not exist on every distro (e.g. openSUSE Tumbleweed ships it under /usr/etc).
- name: Ensure the logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure lid closing behavior
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/50-lid.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Login]
      HandleLidSwitch={{ systemd_lid_config_actions.handle_lid_switch }}
      HandleLidSwitchExternalPower={{ systemd_lid_config_actions.handle_lid_switch_external_power }}
      HandleLidSwitchDocked={{ systemd_lid_config_actions.handle_lid_switch_docked }}
  register: systemd_lid_config_dropin

- name: Reload systemd-logind service to apply changes
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: reloaded
  when: systemd_lid_config_dropin is changed

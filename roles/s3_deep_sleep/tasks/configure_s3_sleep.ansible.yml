---
# Child task file: configure_s3_sleep.ansible.yml
# Applies the sleep mode to the running system. Not persistent on its own: configure_kernel_cmdline.ansible.yml
# makes it survive a reboot.

- name: Check if mem_sleep sysfs file exists
  ansible.builtin.stat:
    path: "{{ s3_deep_sleep_mem_sleep_path }}"
  register: s3_deep_sleep_mem_sleep_file

- name: Read current sleep mode configuration
  ansible.builtin.slurp:
    src: "{{ s3_deep_sleep_mem_sleep_path }}"
  register: s3_deep_sleep_current_raw
  when: s3_deep_sleep_mem_sleep_file.stat.exists

- name: Parse available and active sleep modes
  ansible.builtin.set_fact:
    s3_deep_sleep_available_modes: >-
      {{ (s3_deep_sleep_current_raw.content | b64decode).split() | map('regex_replace', '[\[\]]', '') | list }}
    s3_deep_sleep_active_mode: >-
      {{ (s3_deep_sleep_current_raw.content | b64decode).split() | select('match', '^\[.*\]$')
         | map('regex_replace', '[\[\]]', '') | first | default('unknown') }}
  when: s3_deep_sleep_mem_sleep_file.stat.exists

- name: Display current sleep mode
  ansible.builtin.debug:
    msg: "Current sleep mode: {{ s3_deep_sleep_active_mode | default('unknown') }} (available: {{ s3_deep_sleep_available_modes | default([]) | join(', ') }})"
  when: s3_deep_sleep_check_current | bool

- name: Warn when the firmware does not offer the requested mode
  ansible.builtin.debug:
    msg: >-
      '{{ s3_deep_sleep_mode }}' is not offered by {{ s3_deep_sleep_mem_sleep_path }}
      ({{ s3_deep_sleep_available_modes | join(', ') }}); the firmware may only expose s2idle. Skipping the runtime write.
  when:
    - s3_deep_sleep_available_modes is defined
    - s3_deep_sleep_mode not in s3_deep_sleep_available_modes

- name: Apply the sleep mode at runtime
  ansible.builtin.shell:
    cmd: "echo {{ s3_deep_sleep_mode }} > {{ s3_deep_sleep_mem_sleep_path }}"
  when:
    - s3_deep_sleep_available_modes is defined
    - s3_deep_sleep_mode in s3_deep_sleep_available_modes
    - s3_deep_sleep_active_mode != s3_deep_sleep_mode
  changed_when: true

- name: Display no-change message
  ansible.builtin.debug:
    msg: "Sleep mode already {{ s3_deep_sleep_mode }} at runtime"
  when:
    - s3_deep_sleep_active_mode is defined
    - s3_deep_sleep_active_mode == s3_deep_sleep_mode

---
packman_codecs_enable: true
# Third-party codec repository the multimedia packages are switched to.
# Defaults to VideoLAN (Packman is announced to end on 2027-01-01).
packman_codecs_repo_name: videolan
packman_codecs_repo_url: "https://download.videolan.org/SuSE/Tumbleweed/"
packman_codecs_priority: 90
# Installed ffmpeg library packages (versioned, e.g. libavcodec62) are switched
# to the repository; this matches their names.
packman_codecs_lib_regex: "^(libavcodec|libavdevice|libavfilter|libavformat|libavutil|libswresample|libswscale|libpostproc)[0-9]"
# Packages installed from the repository alongside the ffmpeg libraries.
packman_codecs_extra_packages:
  - gstreamer-plugins-libav
  - vlc-codec-gstreamer
# Packages whose names carry a soname and can drift; a missing one only warns.
packman_codecs_optional_packages:
  - libfdk-aac2
  - libx264-165
  - libx265-216
# aptX / aptX HD Bluetooth codecs: pipewire-aptx is only built by Packman.
# Packman is announced to end on 2027-01-01 and has no known replacement for
# this package. After that date set packman_codecs_aptx to false and remove
# the Packman repository.
# The priority is lower than VideoLAN and the main repository, so only the
# explicit --from install below ever uses Packman.
packman_codecs_aptx: true
packman_codecs_aptx_repo_name: packman
packman_codecs_aptx_repo_url: "https://ftp.gwdg.de/pub/linux/misc/packman/suse/openSUSE_Tumbleweed/"
packman_codecs_aptx_priority: 100
packman_codecs_aptx_package: pipewire-aptx

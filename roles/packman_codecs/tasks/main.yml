---
# openSUSE counterpart of ffmpeg_full: add a third-party codec repository and
# switch the installed ffmpeg libraries to its builds (HEVC, x264/x265, fdk-aac).
- name: Configure codec repository
  when:
    - packman_codecs_enable | bool
    - ansible_facts['pkg_mgr'] == 'zypper'
  become: true
  block:
    - name: Add the codec repository
      community.general.zypper_repository:
        name: "{{ packman_codecs_repo_name }}"
        repo: "{{ packman_codecs_repo_url }}"
        auto_import_keys: true
        priority: "{{ packman_codecs_priority }}"
        state: present
        runrefresh: true

    - name: List installed ffmpeg library packages
      ansible.builtin.command:
        argv: [rpm, -qa, --qf, '%{NAME} %{VERSION}\n', 'libav*', 'libsw*', 'libpostproc*']
      register: packman_codecs_installed
      changed_when: false

    - name: Work out the ffmpeg libraries and major version
      ansible.builtin.set_fact:
        packman_codecs_libs: >-
          {{ packman_codecs_installed.stdout_lines
             | map('regex_replace', ' .*$', '')
             | select('match', packman_codecs_lib_regex) | list }}
        packman_codecs_ffmpeg_major: >-
          {{ (packman_codecs_installed.stdout_lines
              | select('match', '^libavcodec[0-9]') | first | default(''))
             .split(' ')[-1].split('.')[0] }}

    - name: Skip when no ffmpeg libraries are installed
      ansible.builtin.debug:
        msg: "No libavcodec<N> package installed, skipping the codec switch."
      when: packman_codecs_ffmpeg_major == ''

    - name: Switch multimedia packages to the codec repository
      when: packman_codecs_ffmpeg_major != ''
      ansible.builtin.command:
        cmd: >-
          zypper --non-interactive install --from {{ packman_codecs_repo_name }}
          --allow-vendor-change {{ packman_codecs_libs | join(' ') }}
          ffmpeg-{{ packman_codecs_ffmpeg_major }}
          {{ packman_codecs_extra_packages | join(' ') }}
      register: packman_codecs_switch
      changed_when: "'Nothing to do' not in packman_codecs_switch.stdout"

    - name: Install optional codec libraries
      when: packman_codecs_ffmpeg_major != ''
      ansible.builtin.command:
        cmd: >-
          zypper --non-interactive install --from {{ packman_codecs_repo_name }}
          --allow-vendor-change {{ packman_codecs_optional_packages | join(' ') }}
      register: packman_codecs_optional
      changed_when: "'Nothing to do' not in packman_codecs_optional.stdout and packman_codecs_optional.rc == 0"
      failed_when: packman_codecs_optional.rc not in [0, 104]

    - name: Warn about optional codec libraries that could not be resolved
      ansible.builtin.debug:
        msg: "Optional codec packages not found in the repository (names may have drifted): {{ packman_codecs_optional.stderr }}"
      when:
        - packman_codecs_optional is not skipped
        - packman_codecs_optional.rc == 104

    # aptX Bluetooth: only Packman builds pipewire-aptx (ends on 2027-01-01).
    - name: Add the Packman repository (aptX only)
      when: packman_codecs_aptx | bool
      community.general.zypper_repository:
        name: "{{ packman_codecs_aptx_repo_name }}"
        repo: "{{ packman_codecs_aptx_repo_url }}"
        auto_import_keys: true
        priority: "{{ packman_codecs_aptx_priority }}"
        state: present
        runrefresh: true

    - name: Install aptX support from Packman
      when: packman_codecs_aptx | bool
      ansible.builtin.command:
        cmd: >-
          zypper --non-interactive install --from {{ packman_codecs_aptx_repo_name }}
          {{ packman_codecs_aptx_package }}
      register: packman_codecs_aptx_install
      changed_when: "'Nothing to do' not in packman_codecs_aptx_install.stdout and packman_codecs_aptx_install.rc == 0"
      failed_when: packman_codecs_aptx_install.rc not in [0, 104]

    - name: Warn when the aptX package could not be installed
      ansible.builtin.debug:
        msg: "{{ packman_codecs_aptx_package }} not installed (Packman may have ended): {{ packman_codecs_aptx_install.stderr }}"
      when:
        - packman_codecs_aptx_install is not skipped
        - packman_codecs_aptx_install.rc == 104

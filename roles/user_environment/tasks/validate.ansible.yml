---
- name: Check the user entries
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is match('^[a-z_][a-z0-9_-]*$')
      - item.shell | default('/bin/sh') is match('^/[^ ]+$')
      - item.directories | default([]) is sequence
      - item.directories | default([]) is not string
    fail_msg: "Invalid user_environment_users entry: {{ item }} (name: login name; shell: absolute path)."
    quiet: true
  loop: "{{ user_environment_users }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

# Directories stay inside the home directory: relative, no ".." component, no empty component.
- name: Check the directories are relative paths inside the home directory
  ansible.builtin.assert:
    that:
      - item.1 is string
      - item.1 is not match('^/')
      - item.1 | trim('/') | length > 0
      - '".." not in (item.1 | trim("/")).split("/")'
      - '"" not in (item.1 | trim("/")).split("/")'
    fail_msg: "user_environment_users[{{ item.0.name }}].directories: '{{ item.1 }}' must be a relative path inside the home directory."
    quiet: true
  loop: "{{ user_environment_users | subelements('directories', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"

- name: Read the passwd database
  ansible.builtin.getent:
    database: passwd

- name: Check the users exist
  ansible.builtin.assert:
    that: item.name in getent_passwd
    fail_msg: "user_environment_users: no such user '{{ item.name }}'."
    quiet: true
  loop: "{{ user_environment_users }}"
  loop_control:
    label: "{{ item.name }}"
